guration in figures: parallelism, perpendicularity, tangency, collinearity, inside vs outside a region, occluded edges in 3D projections. Assumes a triangle is right-angled because it looks it.\n- **Chemical structure misinterpretation** — skeletal-formula-specific: implicit carbons/hydrogens, bond order, stereochemistry (wedge/dash, cis/trans, R/S), ring size, functional group ID, formal charges and lone pairs. Counts a double bond as single; inverts a stereocenter.\n- **Direction \u0026 sign-convention error** — misreads arrows and orientation: force/current/field direction, reaction vs equilibrium vs resonance arrows, coordinate handedness, clockwise vs counterclockwise moments, slope sign. Takes current as flowing the opposite way; treats a resonance arrow as an equilibrium.\n- **Figure-based quantitative estimation error** — errors in counting or measuring off the image: grid squares, lattice points, spectral peaks, gear teeth, cell divisions; also treating a \"not to scale\" schematic as measurable. Measures an angle off a schematic instead of using the given value.\n- **Unextracted given / prior override** — the figure carries a value or condition available nowhere else and the model omits it, substitutes a plausible number, or answers about a canonical textbook figure it assumed instead of the one shown. Invents a beam length that was dimensioned in the drawing.33:[[\"$\",\"$L66\",\"83932e3d-ea40-47e2-bc50-48cbef08fb3d-d91aef17-4eca-4475-8f24-c9524f1edf72-run\",{\"executionData\":{\"accessLevel\":\"edit\",\"allOriginalValues\":\"$undefined\",\"areSupplementalIPTermsAccepted\":true,\"blockRefactorEnabled\":true,\"blocks\":[{\"id\":\"7920a35d-b78b-432f-b7f6-59ebd7ae0971\",\"uid\":\"fff7ed9b-68a9-42b6-be5c-48c9b08311bd\",\"type\":\"question_preset\",\"label\":\"Subdomain Selection\",\"config\":{\"tagId\":\"8debe58f-92e9-41df-8d89-7a118ae0c91a\",\"title\":\"Subdomain Selection\",\"inputs\":[{\"id\":\"11120002-0000-4000-a000-000000000002\",\"type\":\"select\",\"t
